<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1565c0"><link rel="manifest" href="manifest.webmanifest"><title>Blutzucker-Tagebuch</title><style>
body{margin:0;background:#f3f6f9;color:#17212b;font-family:system-ui,sans-serif}header{background:#1565c0;color:#fff;padding:18px 16px}main{max-width:720px;margin:auto;padding:10px}.card{background:#fff;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 5px #0001}.tabs,.grid,.stats,.actions{display:grid;gap:7px}.tabs{grid-template-columns:repeat(4,1fr)}.grid,.actions{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(3,1fr)}button,input,select,textarea{font:inherit;border-radius:9px;padding:11px;border:1px solid #dfe5ea}button{background:#e7eef7;color:#164b86;font-weight:700;border:0}.active,.primary{background:#1565c0;color:#fff}.primary{width:100%;margin-top:10px}.field{display:flex;flex-direction:column;gap:4px}.full{grid-column:1/-1}.stat{text-align:center;background:#f7f9fb;padding:10px;border-radius:9px}.stat b{display:block;font-size:20px}.muted{color:#66727e;font-size:13px}.entry{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #eee;padding:10px 0}.entry small{display:block;color:#66727e;margin-top:3px}.danger{background:#ffebee;color:#c62828}canvas{width:100%;height:230px}@media(max-width:420px){.grid,.stats{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><header><h1>Blutzucker-Tagebuch</h1><div>Lokale Speicherung auf diesem Gerät</div></header><main>
<section class="card"><div class="tabs"><button data-r="1">Heute</button><button data-r="7">7 Tage</button><button data-r="30">30 Tage</button><button data-r="0">Alle</button></div></section>
<section class="card"><h2>Übersicht</h2><div class="stats"><div class="stat"><b id="avg">—</b>Ø</div><div class="stat"><b id="min">—</b>Min.</div><div class="stat"><b id="max">—</b>Max.</div></div><p id="count" class="muted">0 Messungen</p><canvas id="chart"></canvas></section>
<section class="card"><h2>Neue Messung</h2><div class="grid"><div class="field"><label>Blutzucker</label><input id="value" type="number" step=".1" inputmode="decimal" placeholder="z. B. 105"></div><div class="field"><label>Einheit</label><select id="unit"><option value="mg">mg/dL</option><option value="mmol">mmol/L</option></select></div><div class="field"><label>Zeitpunkt</label><select id="type"><option>Nüchtern</option><option>Morgens</option><option>Mittags</option><option>Abends</option><option>Nach dem Essen</option></select></div><div class="field"><label>Datum/Uhrzeit</label><input id="date" type="datetime-local"></div><div class="field full"><label>Notiz</label><textarea id="note" placeholder="Optional"></textarea></div></div><button class="primary" id="save">Messwert speichern</button></section>
<section class="card"><h2>Messwerte</h2><div id="list"></div></section>
<section class="card"><h2>Daten sichern</h2><div class="actions"><button id="csv">CSV exportieren</button><button id="backup">Backup speichern</button><button id="restore">Backup wiederherstellen</button><button id="clear" class="danger">Alle löschen</button></div><input id="file" type="file" accept=".json" hidden><p class="muted">Die Messwerte werden ausschließlich lokal gespeichert.</p></section></main>
<script>
let db,range=1,$=x=>document.getElementById(x);function now(){let d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}$('date').value=now();
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open('BZDiary',1);r.onupgradeneeded=()=>r.result.createObjectStore('m',{keyPath:'id',autoIncrement:true});r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>no(r.error)})}function all(){return new Promise((ok,no)=>{let r=db.transaction('m').objectStore('m').getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function add(x){return new Promise((ok,no)=>{let r=db.transaction('m','readwrite').objectStore('m').add(x);r.onsuccess=()=>ok();r.onerror=()=>no(r.error)})}function remove(id){return new Promise((ok,no)=>{let r=db.transaction('m','readwrite').objectStore('m').delete(id);r.onsuccess=()=>ok();r.onerror=()=>no(r.error)})}function mg(v,u){return u==='mg'?v:v*18.0182}function show(v,u){return u==='mg'?v.toFixed(0)+' mg/dL':(v/18.0182).toFixed(1)+' mmol/L'}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function refresh(){let a=await all();a.sort((x,y)=>x.ts-y.ts);if(range)a=a.filter(x=>x.ts>=Date.now()-range*86400000);let v=a.map(x=>mg(x.value,x.unit));$('count').textContent=a.length+' Messung'+(a.length===1?'':'en');$('avg').textContent=v.length?(v.reduce((x,y)=>x+y,0)/v.length).toFixed(0):'—';$('min').textContent=v.length?Math.min(...v).toFixed(0):'—';$('max').textContent=v.length?Math.max(...v).toFixed(0):'—';let l=$('list');l.innerHTML='';if(!a.length){l.innerHTML='<p class="muted">Keine Messwerte vorhanden.</p>';return}a.slice().reverse().forEach(x=>{let d=document.createElement('div');d.className='entry';d.innerHTML='<div><b>'+show(x.value,x.unit)+'</b> · '+esc(x.type)+'<small>'+new Date(x.ts).toLocaleString('de-DE')+(x.note?' · '+esc(x.note):'')+'</small></div><button class="danger">Löschen</button>';d.querySelector('button').onclick=async()=>{if(confirm('Messwert löschen?')){await remove(x.id);refresh()}};l.appendChild(d)})}
document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-r]').forEach(x=>x.classList.remove('active'));b.classList.add('active');range=+b.dataset.r;refresh()});$('save').onclick=async()=>{let v=parseFloat($('value').value.replace(',','.'));if(!v||v<=0)return alert('Bitte gültigen Wert eingeben.');await add({value:v,unit:$('unit').value,type:$('type').value,ts:new Date($('date').value).getTime(),note:$('note').value.trim()});$('value').value='';$('note').value='';$('date').value=now();refresh()};function dl(n,t,x){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([x],{type:t}));a.download=n;a.click()}$('backup').onclick=async()=>dl('blutzucker-backup.json','application/json',JSON.stringify({measurements:await all()},null,2));$('restore').onclick=()=>$('file').click();$('file').onchange=async e=>{try{let o=JSON.parse(await e.target.files[0].text());for(let x of o.measurements||[]){delete x.id;await add(x)}alert('Backup wiederhergestellt.');refresh()}catch{alert('Ungültiges Backup.')}};$('clear').onclick=async()=>{if(confirm('Alle Messwerte löschen?')){await new Promise((ok,no)=>{let r=db.transaction('m','readwrite').objectStore('m').clear();r.onsuccess=ok;r.onerror=no});refresh()}};(async()=>{await openDB();document.querySelector('[data-r="1"]').classList.add('active');refresh()})();
</script></body></html>
